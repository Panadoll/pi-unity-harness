[package]
name = "pi_unity_harness_native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "pi-unity"
path = "src/bin/pi_unity.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "net", "sync", "time", "macros", "process"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"
regex = "1"
sha2 = "0.10"


[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
